<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a5c"/>
      <stop offset="100%" style="stop-color:#0a1628"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7eeaff"/>
      <stop offset="100%" style="stop-color:#00d4ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="250" cy="250" r="250" fill="url(#bgGrad)"/>

  <!-- Outer ring -->
  <circle cx="250" cy="250" r="225" fill="none" stroke="#00d4ff" stroke-width="4" opacity="0.6"/>

  <!-- Inner decorative rings -->
  <circle cx="250" cy="250" r="195" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.2"/>
  <circle cx="250" cy="250" r="165" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.15"/>

  <!-- Hexagon background shape -->
  <polygon points="250,80 390,162 390,338 250,420 110,338 110,162"
           fill="#00d4ff" opacity="0.06"/>
  <polygon points="250,90 380,168 380,332 250,410 120,332 120,168"
           fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.2"/>

  <!-- NXC main text -->
  <text x="250" y="295" font-family="Arial Black,Arial,sans-serif" font-weight="900"
        font-size="130" fill="url(#textGrad)" text-anchor="middle"
        filter="url(#glow)">NXC</text>

  <!-- Subtitle -->
  <text x="250" y="360" font-family="Arial,sans-serif" font-weight="bold"
        font-size="28" fill="#ffffff" text-anchor="middle" opacity="0.7"
        letter-spacing="6">NUVIXOCOIN</text>

  <!-- Top dots decoration -->
  <circle cx="250" cy="130" r="6" fill="#00d4ff" opacity="0.8" filter="url(#glow)"/>
  <circle cx="220" cy="145" r="3" fill="#00d4ff" opacity="0.4"/>
  <circle cx="280" cy="145" r="3" fill="#00d4ff" opacity="0.4"/>
</svg>
