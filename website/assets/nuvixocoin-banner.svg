<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a3a5c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d2137;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099cc;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- Grid lines -->
  <g opacity="0.07" stroke="#00d4ff" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
  </g>

  <!-- Decorative circles -->
  <circle cx="900" cy="200" r="180" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.1"/>
  <circle cx="900" cy="200" r="140" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.08"/>
  <circle cx="900" cy="200" r="100" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.06"/>

  <!-- Main coin circle -->
  <circle cx="900" cy="200" r="100" fill="#1a3a5c" stroke="#00d4ff" stroke-width="3" filter="url(#glow)" opacity="0.9"/>
  <circle cx="900" cy="200" r="85" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.4"/>

  <!-- NXC text in coin -->
  <text x="900" y="185" font-family="Arial,sans-serif" font-weight="bold" font-size="38"
        fill="url(#coinGrad)" text-anchor="middle" filter="url(#glow)">NXC</text>
  <text x="900" y="220" font-family="Arial,sans-serif" font-size="14"
        fill="#7eeaff" text-anchor="middle" opacity="0.8">NuvixoCoin</text>

  <!-- Left side: Logo text -->
  <text x="80" y="165" font-family="Arial,sans-serif" font-weight="bold" font-size="72"
        fill="#ffffff" opacity="0.95">Nuvixo</text>
  <text x="80" y="235" font-family="Arial,sans-serif" font-weight="bold" font-size="72"
        fill="#00d4ff" filter="url(#glow)">Coin</text>

  <!-- Tagline -->
  <text x="80" y="280" font-family="Arial,sans-serif" font-size="22"
        fill="#7eeaff" opacity="0.8" letter-spacing="3">Decentralized · Secure · Yours</text>

  <!-- Feature pills -->
  <rect x="80" y="310" width="140" height="32" rx="16" fill="#00d4ff" opacity="0.15" stroke="#00d4ff" stroke-width="1"/>
  <text x="150" y="331" font-family="Arial,sans-serif" font-size="13" fill="#00d4ff" text-anchor="middle">Proof of Stake</text>

  <rect x="232" y="310" width="140" height="32" rx="16" fill="#00d4ff" opacity="0.15" stroke="#00d4ff" stroke-width="1"/>
  <text x="302" y="331" font-family="Arial,sans-serif" font-size="13" fill="#00d4ff" text-anchor="middle">1B NXC Supply</text>

  <rect x="384" y="310" width="140" height="32" rx="16" fill="#00d4ff" opacity="0.15" stroke="#00d4ff" stroke-width="1"/>
  <text x="454" y="331" font-family="Arial,sans-serif" font-size="13" fill="#00d4ff" text-anchor="middle">Asset Exchange</text>

  <!-- Version badge -->
  <rect x="1080" y="20" width="100" height="28" rx="14" fill="#00d4ff" opacity="0.2" stroke="#00d4ff" stroke-width="1"/>
  <text x="1130" y="39" font-family="Arial,sans-serif" font-size="13" fill="#00d4ff" text-anchor="middle">v2.0.0</text>
</svg>
